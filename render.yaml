services:
  - type: web
    name: velvent
    runtime: node
    plan: free
    region: singapore
    branch: main
    # The schema is applied on every deploy, not by hand. schema.sql is made of
    # CREATE TABLE IF NOT EXISTS and ADD COLUMN IF NOT EXISTS, so running it
    # against a live database is a no-op until something has actually changed.
    # It runs in the build rather than at startup: a migration that fails
    # should fail the deploy and leave the running version serving, not take
    # the site down after it has already gone live.
    buildCommand: npm run build && npm run db:setup
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # Paste your Neon pooled connection string in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # Render generates a strong value on first deploy.
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Leave blank for Cash on Delivery only; add keys to switch online payment on.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
