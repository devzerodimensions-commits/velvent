services:
  - type: web
    name: velvent
    runtime: node
    plan: free
    region: singapore
    branch: main
    # The schema is applied on every deploy, but by the server as it boots
    # (see src/lib/migrate.js) rather than here. The build runs in a sandbox
    # that need not have the database reachable; the running server always
    # does. A migration that fails stops the server starting, the health check
    # below fails, and Render keeps serving the previous version.
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # Paste your Neon pooled connection string in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # Render generates a strong value on first deploy.
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Leave blank for Cash on Delivery only; add keys to switch online payment on.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
