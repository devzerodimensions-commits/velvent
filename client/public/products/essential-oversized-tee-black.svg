<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Black oversized t-shirt">
  <defs>
    <linearGradient id="bgblack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFEBE3"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="clothblack" x1="0.1" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#2C3138"/><stop offset="0.45" stop-color="#1A1D22"/><stop offset="1" stop-color="#0E1014"/>
    </linearGradient>
    <filter id="shblack" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2C3544" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bgblack)"/>
  <ellipse cx="400" cy="880" rx="235" ry="30" fill="#2C3544" opacity="0.07"/>

  <g filter="url(#shblack)">
    <path d="M 265 178 Q 400 252 535 178 L 652 212 L 688 420 L 556 452 L 558 836 L 242 836 L 244 452 L 112 420 L 148 212 Z" fill="url(#clothblack)"/>
    <path d="M 265 178 Q 400 252 535 178 Q 400 218 265 178 Z" fill="#0E1014"/>
    <path d="M 278 182 Q 400 244 522 182 Q 400 212 278 182 Z" fill="#EFEBE3" opacity="0.5"/>
    
    <!-- soft fabric folds -->
    <path d="M 300 470 Q 318 640 306 820" stroke="#0E1014" stroke-width="7" fill="none" opacity="0.17" stroke-linecap="round"/>
    <path d="M 500 470 Q 484 640 496 820" stroke="#0E1014" stroke-width="7" fill="none" opacity="0.17" stroke-linecap="round"/>
    <path d="M 400 500 Q 408 660 400 810" stroke="#2C3138" stroke-width="5" fill="none" opacity="0.13" stroke-linecap="round"/>
    <!-- cuff + hem ribbing -->
    <path d="M 118 400 L 250 434" stroke="#0E1014" stroke-width="6" opacity="0.30" stroke-linecap="round"/>
    <path d="M 682 400 L 550 434" stroke="#0E1014" stroke-width="6" opacity="0.30" stroke-linecap="round"/>
    <path d="M 244 818 L 558 818" stroke="#0E1014" stroke-width="6" opacity="0.26" stroke-linecap="round"/>
  </g>

  <text x="400" y="944" text-anchor="middle" font-family="Montserrat, Helvetica, Arial, sans-serif"
        font-size="21" letter-spacing="7" fill="#2C3544" opacity="0.62">VELVENT</text>
</svg>
